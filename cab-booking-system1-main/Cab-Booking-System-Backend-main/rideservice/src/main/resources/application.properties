# ========================
# RIDE SERVICE
# ========================
spring.application.name=RIDE-SERVICE
server.port=8083

# Disable Config Server check (use local properties)
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.main.allow-bean-definition-overriding=true

# ---- Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/cab_booking_rides?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Sri@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Eureka ----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.status-page-url-path=/api/rides/swagger-ui.html

# ---- Swagger UI ----
springdoc.api-docs.path=/api/rides/v3/api-docs
springdoc.swagger-ui.path=/api/rides/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
