# ========================
# API GATEWAY
# ========================
spring.application.name=API-GATEWAY
server.port=8080

# Disable Config Server check (use local properties)
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# ---- Eureka ----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ---- Feign client to Auth Service ----
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.client.config.AUTH-SERVICE.connectTimeout=3000
feign.client.config.AUTH-SERVICE.readTimeout=3000

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info

# ==============================================================================
# Gateway Routes (Spring Cloud Gateway Server WebMVC)
# ==============================================================================

# Route 0: Auth Service (Public endpoints)
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=CircuitBreaker=name=authRouteCB,fallbackUri=forward:/fallback/auth-service

# Route 1: Location Service
spring.cloud.gateway.server.webmvc.routes[1].id=location-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://LOCATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/locations/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=CircuitBreaker=name=locationServiceCB,fallbackUri=forward:/fallback/location-service

# Route 2: User Service
spring.cloud.gateway.server.webmvc.routes[2].id=user-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/users/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=CircuitBreaker=name=userServiceCB,fallbackUri=forward:/fallback/user-service

# Route 3: Driver Service
spring.cloud.gateway.server.webmvc.routes[3].id=driver-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://DRIVER-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/drivers/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=CircuitBreaker=name=driverServiceCB,fallbackUri=forward:/fallback/driver-service

# Route 4: Ride Service
spring.cloud.gateway.server.webmvc.routes[4].id=ride-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://RIDE-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/rides/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=CircuitBreaker=name=rideServiceCB,fallbackUri=forward:/fallback/ride-service

# Route 5: Payment Service
spring.cloud.gateway.server.webmvc.routes[5].id=payment-service
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=CircuitBreaker=name=paymentServiceCB,fallbackUri=forward:/fallback/payment-service

# Route 6: Rating Service
spring.cloud.gateway.server.webmvc.routes[6].id=rating-service
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://RATING-SERVICE
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/ratings/**
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=CircuitBreaker=name=ratingServiceCB,fallbackUri=forward:/fallback/rating-service

# ==============================================================================
# Resilience4j Circuit Breakers Configuration
# ==============================================================================
resilience4j.circuitbreaker.instances.authRouteCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.authRouteCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.authRouteCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authRouteCB.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.locationServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.locationServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.locationServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.locationServiceCB.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.userServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.userServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userServiceCB.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.driverServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.driverServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.driverServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.driverServiceCB.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.rideServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.rideServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.rideServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.rideServiceCB.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.paymentServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.paymentServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.paymentServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.paymentServiceCB.waitDurationInOpenState=10s

resilience4j.circuitbreaker.instances.ratingServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.ratingServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.ratingServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ratingServiceCB.waitDurationInOpenState=10s

# Time limiter configuration
resilience4j.timelimiter.instances.authRouteCB.timeoutDuration=10s
resilience4j.timelimiter.instances.locationServiceCB.timeoutDuration=10s
resilience4j.timelimiter.instances.userServiceCB.timeoutDuration=10s
resilience4j.timelimiter.instances.driverServiceCB.timeoutDuration=10s
resilience4j.timelimiter.instances.rideServiceCB.timeoutDuration=10s
resilience4j.timelimiter.instances.paymentServiceCB.timeoutDuration=10s
resilience4j.timelimiter.instances.ratingServiceCB.timeoutDuration=10s
