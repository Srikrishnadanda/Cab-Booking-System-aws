apiVersion: apps/v1
kind: Deployment
metadata:
  name: eurekaserver
  namespace: cab-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eurekaserver
  template:
    metadata:
      labels:
        app: eurekaserver
    spec:
      containers:
        - name: eurekaserver
          image: cab-booking-system1-main-eurekaserver:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          env:
            - name: SERVER_PORT
              value: "8761"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "eurekaserver"
            - name: EUREKA_CLIENT_REGISTER_WITH_EUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCH_REGISTRY
              value: "false"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eurekaserver:8761/eureka/"
---
apiVersion: v1
kind: Service
metadata:
  name: eurekaserver
  namespace: cab-booking
spec:
  selector:
    app: eurekaserver
  ports:
    - port: 8761
      targetPort: 8761
