  # ========================================================
  # 10. API GATEWAY
  # ========================================================
  apigateway:
    build:
      context: ./cab-booking-system1-main/Cab-Booking-System-Backend-main/apigateway
    container_name: cab-apigateway
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - eurekaserver
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    networks:
      - cab-network

