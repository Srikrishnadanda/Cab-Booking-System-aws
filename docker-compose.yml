networks:
  cab-network:
    driver: bridge

volumes:
  mysql-data:

services:
  # ========================================================
  # 1. DATABASE
  # ========================================================
  mysql:
    image: mysql:8.0
    container_name: cab-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Sri@12345
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - cab-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pSri@12345 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ========================================================
  # 2. SERVICE REGISTRY (EUREKA)
  # ========================================================
  eurekaserver:
    build:
      context: ./cab-booking-system1-main/Cab-Booking-System-Backend-main/eurekaserver
    container_name: cab-eureka
    restart: on-failure
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
      - EUREKA_INSTANCE_HOSTNAME=eurekaserver
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
    networks:
      - cab-network

  # ========================================================
  # 3. AUTH SERVICE
  # ========================================================
  authservice:
    build:
      context: ./cab-booking-system1-main/Cab-Booking-System-Backend-main/authservice
    container_name: cab-authservice
    restart: on-failure
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/cab_booking_auth?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Sri@12345
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    networks:
      - cab-network

  # ========================================================
  # 4. USER SERVICE
  # ========================================================
  userservice:
    build:
      context: ./cab-booking-system1-main/Cab-Booking-System-Backend-main/userservice
    container_name: cab-userservice
    restart: on-failure
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/cab_booking_users?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Sri@12345
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
    networks:
      - cab-network

  # ========================================================
  # 5. DRIVER SERVICE
  # ========================================================
  driverservice:
    build:
      context: ./cab-booking-system1-main/Cab-Booking-System-Backend-main/driverservice
    container_name: cab-driverservice
    restart: on-failure
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      eurekaserver:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/cab_booking_drivers?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=Sri@12345
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eurekaserver:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
